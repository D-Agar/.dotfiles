# List of plugins
# navigate tmux panes and vim splits
set -g @plugin 'christoomey/vim-tmux-navigator'
# save selection to clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
# save and restore sessions (and neovim if wanted)
set -g @plugin 'tmux-plugins/tmux-resurrect'
# automatic saving
set -g @plugin 'tmux-plugins/tmux-continuum'
# sensible defaults (see tmux/plugins/)
set -g @plugin 'tmux-plugins/tmux-sensible'
# prefix+space or ctrl+space
set -g @plugin 'alexwforsythe/tmux-which-key'
# prefix+F
set -g @plugin 'sainnhe/tmux-fzf'


##################################
###          OPTIONS           ###
##################################

# restore neovim sessions
set -g @resurrect-strategy-nvim 'session'

# Enable full mouse support.
set -g mouse on

# Encoding issues
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_CONNECTION WINDOWID XAUTHORITY"

# True colour support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# I use vim btw..
set -g mode-keys vi
# ..but I have to admit
set -g status-keys emacs

# required for yazi (file manager)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# required for neovim solarized-osaka
# Undercurl
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# easier window navigation
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Alacritty
set -as terminal-features ",alacritty:RGB"

##################################
###    STATUS BAR AND STYLE    ###
##################################

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# panes
set -g pane-border-style 'fg=green'
set -g pane-active-border-style 'fg=red'

set -g status-position bottom

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=terminal fg=terminal'

set -g status-left "#{?client_prefix,#[bg=magenta fg=black bold]}#{?pane_synchronized,#[bg=red fg=white bold]} #S #[bg=terminal,fg=terminal] "
set -g status-left-style 'bg=cyan fg=black bold'
set -g status-left-length 10

set -g status-right "#{?client_prefix,#[bg=magenta fg=black bold]}#{?pane_synchronized,#[bg=red fg=white bold]} cwd:#{b:pane_current_path} | #{user}@#H "
set -g status-right-style 'bg=cyan fg=black bold'
set -g status-right-length 50

# Window status styling
setw -g window-status-separator ""
setw -g window-status-current-style 'fg=blue bold bg=terminal'

setw -g window-status-style 'fg=terminal bg=terminal'
setw -g window-status-format ' #[fg=terminal]#F #I:#[fg=terminal]#W '

setw -g window-status-bell-style 'fg=black bold bg=red bold'

# messages
set -g message-style 'fg=black bold bg=green fill=green'

##################################
###        KEYBINDINGS         ###
##################################

# bind ` send-prefix
# GNU-Screen compatible prefix
set -g prefix2 C-b
bind C-b send-prefix -2


# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# quick reload
bind r source-file ~/.tmux.conf

# Fix Home and End keys
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# Enable native tmux movements while in copy-mode
# bind-key -T copy-mode-vi 'C-h' select-pane -L
# bind-key -T copy-mode-vi 'C-j' select-pane -D
# bind-key -T copy-mode-vi 'C-k' select-pane -U
# bind-key -T copy-mode-vi 'C-l' select-pane -R
# bind-key -T copy-mode-vi 'C-\' select-pane -l

# Split current window horizontally
bind s split-window -v -c "#{pane_current_path}"
# Split current window vertically
bind v split-window -h -c "#{pane_current_path}"

# Preferred pane resizing
bind-key -r -T prefix       M-k              resize-pane -U 5
bind-key -r -T prefix       M-j           resize-pane -D 5
bind-key -r -T prefix       M-h            resize-pane -L 5
bind-key -r -T prefix       M-l           resize-pane -R 5

# Clearing the screen
bind C-l send-keys 'C-l'

### Useful keybindings ###
# not a keybinding but 'tmux list-keys' shows them all
## Searching
# prefix + / - regex search (forward)
# prefix + ? - regex search (backward)
# prefix + ctrl-f - simple file search
# prefix + ctrl-g - jumping over git status files (best used after git status command)
# prefix + alt-h - jumping over SHA-1/SHA-256 hashes (best used after git log command)
# prefix + ctrl-u - url search (http, ftp and git urls)
# prefix + ctrl-d - number search (mnemonic d, as digit)
# prefix + alt-i - ip address search

# automatic tpm installation
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initalise TPM (must be at the bottom)
run '~/.tmux/plugins/tpm/tpm'
